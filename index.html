<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Empowering Your Vision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Empowering your vision with strategic insight, refined design, and results-driven marketing, crafted by a dedicated marketing student committed to helping ideas grow.">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .hero {
      max-width: 800px;
      padding: 2rem;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5rem;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: #f9fafb;
    }
    .hero p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 2rem;
    }
    .hero .cta {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .hero .cta:hover {
      background: #0ea5e9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="hero">
    <h1>Empowering Your Vision</h1>
    <p>
      Empowering your vision with strategic insight, refined design, and results‑driven marketing,
      crafted by a dedicated marketing student committed to helping ideas grow.
    </p>
    <a href="#projects" class="cta">View My Work</a>
  </main>
</body>
</html>
