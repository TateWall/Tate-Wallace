<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome! Tate Wallace, MKT 3620</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Empowering your vision with strategic insight, refined design, and results-driven marketing, crafted by a dedicated marketing student committed to helping ideas grow.">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #2f3e46; /* Slate gray */
      color: #e5e7eb;
      min-height: 100vh;
    }

    /* Horizontal Navigation */
    .site-nav {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .site-nav ul {
      display: flex;
      gap: 2rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .site-nav a {
      color: #4fd1c5; /* Teal accent */
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .site-nav a:hover {
      color: #38b2ac; /* Slightly darker teal */
    }

    /* Hero Section */
    .hero {
      max-width: 800px;
      padding: 2rem;
      text-align: center;
      margin: 0 auto;
      padding-top: 20vh;
    }

    .hero h1 {
      font-size: 2.5rem;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: #f9fafb;
      white-space: pre-line; /* Allows line breaks */
    }

    .hero p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 2rem;
    }

    .hero .cta {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      background: #4fd1c5; /* Teal button */
      color: #2f3e46; /* Slate text */
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .hero .cta:hover {
      background: #38b2ac;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <main class="hero">
    <h1>
Welcome!
Tate Wallace
MKT 3620
    </h1>

    <p>
      Empowering your vision with strategic insight, refined design, and results‑driven marketing,
      crafted by a dedicated marketing student committed to helping ideas grow.
    </p>

    <a href="#projects" class="cta">View My Work</a>
  </main>

  <script src="navigation.js"></script>
</body>
</html>
