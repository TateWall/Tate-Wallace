<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Personal Interests – Tate Wallace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #2f3e46; /* Slate gray */
      color: #e5e7eb;
      min-height: 100vh;
      padding-top: 120px;
    }

    .interests-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .interests-wrapper h1 {
      font-size: 2.3rem;
      color: #f9fafb;
      margin-bottom: 1rem;
    }

    .interests-wrapper ul {
      list-style: disc;
      padding-left: 1.5rem;
      color: #cbd5f5;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    /* Teal accent for bullets */
    .interests-wrapper ul li::marker {
      color: #0fb9b1; /* Vibrant darker teal */
    }
  </style>
</head>

<body>
  <div class="interests-wrapper">
    <h1>Personal Interests</h1>
    <ul>
      <li>Traveling</li>
      <li>Discovering new restaurants</li>
      <li>Working out</li>
      <li>Watching movies (Star Wars, MCU, comedies, thrillers)</li>
    </ul>
  </div>

  <script src="navigation.js"></script>
</body>
</html>
